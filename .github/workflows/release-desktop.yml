name: Build release desktop installers
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
permissions:
  contents: read
# setup-go, tests and packaging must use the same worktree-local caches.
env:
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
jobs:
  desktop:
    environment: release
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    env:
      MOLR_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.0'
      - uses: actions/setup-go@v6
        with:
          go-version-file: runtime/.go-version
          cache-dependency-path: runtime/go.sum
      - if: runner.os == 'Linux'
        uses: ./.github/actions/prepare-sandbox
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run test:desktop && npm run build:desktop
      - if: runner.os != 'Linux'
        run: npm run test:desktop:electron
      - if: runner.os == 'Linux'
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            aa-exec -p chrome -- xvfb-run -a npm run test:desktop:electron
          else
            xvfb-run -a npm run test:desktop:electron
          fi
      - if: runner.os != 'Windows'
        run: npm run build:release
      - if: runner.os == 'Windows'
        run: node apps/desktop/scripts/build-windows-runtime.mjs
      - if: runner.os == 'Windows'
        name: Native Windows backend
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:MOLR_TEST_BINARY = (Resolve-Path '.cache/release/win32-amd64/molr/bin/molr.exe').Path
          go -C runtime test ./internal/platform/sandbox ./internal/textfiles ./internal/installationwindows ./internal/config ./internal/platform ./internal/persistence/sqlitestore -run "TestWindows|TestControlledReady|TestNativeSandbox" -count=1
      - name: Native desktop Runtime lifecycle
        run: node apps/desktop/tests/local-runtime.mjs
      - if: runner.os == 'Linux' || (runner.os == 'macOS' && inputs.channel == 'nightly')
        name: Package desktop without publisher signing or notarization
        run: npm run package:desktop
      - if: runner.os == 'Windows'
        name: Package and sign Windows desktop
        run: npm run package:desktop
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - if: runner.os == 'macOS' && inputs.channel != 'nightly'
        name: Sign DMG and submit notarization without waiting
        run: node apps/desktop/scripts/package.mjs --defer-notarization
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - if: runner.os == 'macOS' && inputs.channel != 'nightly'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-notarization-${{ runner.arch }}
          path: |
            dist/desktop/darwin-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}/*.dmg
            dist/desktop/darwin-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}/notarization.json
          if-no-files-found: error
          retention-days: 14
      - if: runner.os != 'macOS' || inputs.channel == 'nightly'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/desktop/**/*.deb
            dist/desktop/**/*.dmg
            dist/desktop/**/*.exe
            dist/desktop/**/*.sha256
            dist/desktop/**/desktop-manifest.json
          if-no-files-found: error
          retention-days: 14
  notarize:
    needs: desktop
    if: inputs.channel != 'nightly'
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      MOLR_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.0'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-notarization-${{ runner.arch }}
          path: dist/notarization
      - name: Complete notarization (prereleases allow pending timeout)
        run: node apps/desktop/scripts/notarization.mjs dist/notarization
        env:
          MOLR_NOTARIZATION_POLICY: ${{ inputs.channel == 'preview' && 'optional' || 'required' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/notarization/**/*.dmg
            dist/notarization/**/*.sha256
            dist/notarization/**/desktop-manifest.json
          if-no-files-found: error
          retention-days: 14
