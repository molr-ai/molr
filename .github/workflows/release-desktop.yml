name: Package release desktop installers
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      matrix:
        required: true
        type: string
permissions:
  contents: read
env:
  MOLR_VERSION: ${{ inputs.version }}
  MOLR_BUILD_ASSETS: '1'
jobs:
  desktop:
    environment: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - uses: actions/download-artifact@v4
        with:
          name: release-application-assets
          path: .cache/assets-download
      - uses: actions/download-artifact@v4
        with:
          name: release-payload-${{ matrix.os }}-${{ matrix.arch }}
          path: .cache/payload-download
      - name: Restore previously built assets and native Runtime
        shell: bash
        run: |
          tar -xzf .cache/assets-download/application-assets.tar.gz
          node scripts/build-assets.mjs --verify
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto"),p=".cache/payload-download/"; if(crypto.createHash("sha256").update(fs.readFileSync(p+"runtime-payload.tar.gz")).digest("hex")!==fs.readFileSync(p+"runtime-payload.sha256","utf8")) throw Error("Runtime payload checksum mismatch");'
          mkdir -p .cache/release/${{ matrix.os }}-${{ matrix.arch }}
          tar -xzf .cache/payload-download/runtime-payload.tar.gz -C .cache/release/${{ matrix.os }}-${{ matrix.arch }}
      - if: runner.os == 'Linux'
        uses: ./.github/actions/prepare-sandbox
      - if: runner.os == 'Linux' || (runner.os == 'macOS' && inputs.channel == 'nightly')
        name: Package without publisher signing or notarization
        run: npm run package:desktop
      - if: runner.os == 'Windows'
        name: Package Windows desktop (signing is optional)
        run: npm run package:desktop
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - if: runner.os == 'macOS' && inputs.channel != 'nightly'
        name: Sign DMG and submit notarization without waiting
        run: node apps/desktop/scripts/package.mjs --defer-notarization
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - if: runner.os == 'Linux'
        name: Evaluate the packaged desktop and bundled Runtime
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            aa-exec -p chrome -- xvfb-run -a node scripts/test-desktop-package.mjs
          else
            xvfb-run -a node scripts/test-desktop-package.mjs
          fi
      - if: runner.os == 'Windows' || (runner.os == 'macOS' && inputs.channel == 'nightly')
        name: Evaluate the packaged desktop and bundled Runtime
        run: node scripts/test-desktop-package.mjs
      - if: runner.os == 'macOS' && inputs.channel != 'nightly'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: desktop-notarization-${{ matrix.arch }}
          path: |
            dist/desktop/darwin-${{ matrix.arch }}/*.dmg
            dist/desktop/darwin-${{ matrix.arch }}/notarization.json
          if-no-files-found: error
          retention-days: 14
      - if: runner.os != 'macOS' || inputs.channel == 'nightly'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: desktop-release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/desktop/**/*.deb
            dist/desktop/**/*.dmg
            dist/desktop/**/*.exe
            dist/desktop/**/*.sha256
            dist/desktop/**/desktop-manifest.json
          if-no-files-found: error
          retention-days: 14
  notarize:
    needs: desktop
    if: inputs.channel != 'nightly'
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: amd64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-application-assets
          path: .cache/assets-download
      - run: tar -xzf .cache/assets-download/application-assets.tar.gz && node scripts/build-assets.mjs --verify
      - uses: actions/download-artifact@v4
        with:
          name: desktop-notarization-${{ matrix.arch }}
          path: dist/notarization
      - name: Complete notarization (prereleases allow pending timeout)
        run: node apps/desktop/scripts/notarization.mjs dist/notarization
        env:
          MOLR_NOTARIZATION_POLICY: ${{ inputs.channel == 'preview' && 'optional' || 'required' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Evaluate final DMG and bundled Runtime
        run: node scripts/test-desktop-package.mjs dist/notarization
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: desktop-release-darwin-${{ matrix.arch }}
          path: |
            dist/notarization/*.dmg
            dist/notarization/*.sha256
            dist/notarization/desktop-manifest.json
          if-no-files-found: error
          retention-days: 14
