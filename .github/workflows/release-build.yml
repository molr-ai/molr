name: Build and publish release
on:
  workflow_call:
    inputs:
      kind:
        required: true
        type: string
      ref:
        required: true
        type: string
    outputs:
      channel:
        value: ${{ jobs.prepare.outputs.channel }}
permissions:
  contents: read
  actions: write
env:
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      commit: ${{ steps.release.outputs.commit }}
      matrix: ${{ steps.release.outputs.native_matrix }}
      existing: ${{ steps.release.outputs.existing }}
      published_at: ${{ steps.release.outputs.published_at }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.0'
      - id: release
        run: node scripts/prepare-release.mjs
        env:
          RELEASE_KIND: ${{ inputs.kind }}
          RELEASE_TAG: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
          MOLR_RELEASE_SCAN_LIMIT: ${{ vars.MOLR_RELEASE_SCAN_LIMIT || '100' }}
  ci:
    needs: prepare
    if: needs.prepare.outputs.existing != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    concurrency:
      group: ci-gate-${{ needs.prepare.outputs.commit }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.0'
      - name: Reuse or request complete CI for the fixed source commit
        run: node scripts/ensure-ci.mjs
        env:
          MOLR_COMMIT: ${{ needs.prepare.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
  assets:
    needs: [prepare, ci]
    uses: ./.github/workflows/build-assets.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}
      prefix: release-
  native:
    needs: [prepare, assets]
    uses: ./.github/workflows/native-build.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}
      prefix: release-
      matrix: ${{ needs.prepare.outputs.matrix }}
  installer:
    needs: [prepare, native]
    uses: ./.github/workflows/installer-acceptance.yml
    with:
      artifact-prefix: release-runtime-
      ref: ${{ needs.prepare.outputs.commit }}
  desktop:
    needs: [prepare, native]
    uses: ./.github/workflows/release-desktop.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}
      channel: ${{ needs.prepare.outputs.channel }}
      matrix: ${{ needs.prepare.outputs.matrix }}
    secrets: inherit
  publish:
    needs: [prepare, ci, native, installer, desktop]
    runs-on: ubuntu-24.04
    environment: release
    concurrency:
      group: release-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.0'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-runtime-*
          path: dist/releases
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-release-*
          path: dist/desktop-release
      - run: npm run build:source -- --ref HEAD --output dist/releases
      - run: npm run release:manifest -- --version "$MOLR_VERSION" --repository "$GITHUB_REPOSITORY"
        env:
          MOLR_VERSION: ${{ needs.prepare.outputs.version }}
          MOLR_PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
      - run: node scripts/desktop-release.mjs
      - run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  mirror:
    needs: [prepare, publish]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          needs.prepare.outputs.channel == 'stable' &&
          (needs.prepare.outputs.existing == 'true' || needs.publish.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: release
    concurrency:
      group: release-mirror
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.0'
      - name: Install verified ossutil
        shell: bash
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --connect-timeout 8 --max-time 180 --retry 2 \
            -o "$RUNNER_TEMP/ossutil.zip" https://gosspublic.alicdn.com/ossutil/v2/2.4.1/ossutil-2.4.1-linux-amd64.zip
          printf '%s  %s\n' '57ee4c56796a40144acd6b0b96b53b4ba75e5cec09c01d8d0313c09a5524022f' "$RUNNER_TEMP/ossutil.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ossutil.zip" -d "$RUNNER_TEMP/ossutil"
          chmod 755 "$RUNNER_TEMP/ossutil/ossutil-2.4.1-linux-amd64/ossutil"
          echo "$RUNNER_TEMP/ossutil/ossutil-2.4.1-linux-amd64" >> "$GITHUB_PATH"
      - name: Download the published release (also on publication retries)
        run: gh release download "v$MOLR_VERSION" --repo "$GITHUB_REPOSITORY" --dir dist/releases
        env:
          MOLR_VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
      - name: Publish official stable mirror
        run: node scripts/publish-release-mirror.mjs
        env:
          MOLR_VERSION: ${{ needs.prepare.outputs.version }}
          MOLR_OSS_BUCKET: ${{ vars.MOLR_OSS_BUCKET }}
          OSS_REGION: ${{ vars.MOLR_OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.MOLR_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.MOLR_OSS_ACCESS_KEY_SECRET }}
