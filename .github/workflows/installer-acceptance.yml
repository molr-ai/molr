name: Fresh-host installer acceptance
on:
  workflow_call:
    inputs:
      artifact-prefix:
        type: string
        required: true
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  install:
    name: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: ubuntu-24.04-amd64
            runner: ubuntu-24.04
            arch: amd64
            os: linux
          - environment: ubuntu-24.04-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            os: linux
          - environment: macos-arm64
            runner: macos-15
            arch: arm64
            os: darwin
          - environment: macos-amd64
            runner: macos-15-intel
            arch: amd64
            os: darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.0'
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-prefix }}${{ matrix.os }}-${{ matrix.arch }}
          path: dist/releases
      - name: Prepare login session, leaving dependency preparation to Molr
        if: matrix.os == 'linux'
        run: |
          # This job is disposable. Do not use this preparation on a developer host.
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict || true
          fi
          sudo apt-get purge -y bubblewrap busybox-static apparmor-profiles
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Preview, interactive install, silent reinstall, sandbox verification and uninstall
        env:
          MOLR_TEST_PREPARE: '1'
        run: |
          archives=(dist/releases/*.tar.gz)
          test "${#archives[@]}" -eq 1
          for mode in server sandbox; do
            MOLR_TEST_MODE="$mode" MOLR_TEST_ARCHIVE="${archives[0]}" node scripts/test-release-install.mjs
          done
