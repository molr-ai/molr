name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare-sandbox
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.0'
      - uses: actions/setup-go@v6
        with:
          go-version-file: runtime/.go-version
          cache-dependency-path: runtime/go.sum
      - name: Public contract inventory
        run: npm run check:contracts
      - run: npm ci
      - run: npm run docs:check && npm run test:docs && npm run check:platforms && npm run check:release && npm run check:licenses
      - run: npm run test:release && npm run test:release-flow
      - run: python3 scripts/test-install-download.py
      - run: npm run test --workspace @molr/ui
      - run: npm run typecheck && npm run build
        env:
          VITE_SITE_MODE: live
      - if: runner.arch == 'X64'
        run: npx playwright install --with-deps --no-shell chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
      - if: runner.arch == 'X64'
        run: npm run test:website
      - run: go test ./...
        working-directory: runtime
        env:
          CGO_ENABLED: '0'
      - run: npm run build:release
      - name: Native installation and sandbox acceptance
        run: |
          arch=$(node -p '({x64: "amd64", arm64: "arm64"})[process.arch]')
          for mode in server sandbox; do
            MOLR_TEST_MODE="$mode" MOLR_TEST_ARCHIVE="dist/releases/molr_0.1.0-local_linux_${arch}.tar.gz" npm run test:release-install
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ci-install-linux-${{ runner.arch == 'X64' && 'amd64' || 'arm64' }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 7
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.0'
      - uses: actions/setup-go@v6
        with:
          go-version-file: runtime/.go-version
          cache-dependency-path: runtime/go.sum
      - name: Public contract inventory
        run: npm run check:contracts
      - run: npm ci
      - if: runner.arch == 'X64'
        run: npx playwright install --no-shell chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
      - if: runner.arch == 'X64'
        run: npm run test:website
      - name: Native Runtime and Full Access tests
        working-directory: runtime
        env:
          CGO_ENABLED: '0'
        run: |
          go test -p 4 ./...
          go vet ./...
          go build ./...
      - run: npm run build:release
      - uses: actions/upload-artifact@v4
        with:
          name: ci-install-darwin-${{ runner.arch == 'X64' && 'amd64' || 'arm64' }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 7
  installer-acceptance:
    needs: [checks, macos]
    uses: ./.github/workflows/installer-acceptance.yml
    with:
      artifact-prefix: ci-install-
      ref: ${{ github.sha }}
