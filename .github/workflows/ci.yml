name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.0'
      - uses: actions/setup-go@v6
        with:
          go-version-file: runtime/.go-version
          cache-dependency-path: runtime/go.sum
      - run: npm ci
      - run: npm run check:platforms && npm run check:release && npm run check:licenses
      - run: npm run test:release && npm run test:release-flow
      - run: python3 scripts/test-install-download.py && python3 runtime/scripts/test-install-linux.py && python3 runtime/scripts/test-uninstall-linux.py
      - run: npm run test --workspace @molr/ui
      - run: npm run typecheck && npm run build
        env:
          VITE_SITE_MODE: live
      - if: runner.arch == 'X64'
        run: npx playwright install --with-deps chromium
      - if: runner.arch == 'X64'
        run: npm run test:website
      - run: go test ./...
        working-directory: runtime
        env:
          CGO_ENABLED: '0'
      - run: npm run build:release
      - name: Install native sandbox dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap busybox-static ca-certificates file util-linux
      - name: Prepare delegated user service manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Probe Bubblewrap under the service security settings
        run: |
          systemd-run --user --pipe --wait --collect --unit=molr-ci-bwrap -p NoNewPrivileges=yes /usr/bin/bwrap --unshare-all --disable-userns --assert-userns-disabled --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true
      - name: Native installation and sandbox acceptance
        run: |
          arch=$(node -p '({x64: "amd64", arm64: "arm64"})[process.arch]')
          MOLR_TEST_ARCHIVE="dist/releases/molr_0.1.0-local_linux_${arch}.tar.gz" npm run test:release-install
