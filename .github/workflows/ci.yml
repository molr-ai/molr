name: CI
run-name: CI v3 ${{ inputs.commit || github.sha }}
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact main-history commit to validate (defaults to selected ref)
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || inputs.commit || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      matrix: ${{ steps.identity.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - id: identity
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          commit=$(git rev-parse HEAD)
          if [ "$DISPATCH" = true ]; then
            if [ -n "$REQUESTED_COMMIT" ]; then
              [[ "$REQUESTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
              test "$REQUESTED_COMMIT" = "$commit"
            fi
            git merge-base --is-ancestor "$commit" origin/main
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          node --input-type=module -e 'import {nativeBuildMatrix} from "./scripts/release-lib.mjs"; console.log("matrix="+JSON.stringify(nativeBuildMatrix()));' >> "$GITHUB_OUTPUT"
  source:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: ./.github/actions/setup-build
      - name: Require a development base newer than published stable releases
        run: npm run check:base-version
        env:
          MOLR_RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
      - run: npm run check && npm run test:polling && npm run test:docs && npm run test:release && npm run test:release-flow
      - run: python3 scripts/test-install-download.py && python3 scripts/test-install-interactive-driver.py
      - run: npm run test --workspace @molr/ui
      - run: npm run typecheck --workspace @molr/ui --workspace @molr/ui-host --workspace @molr/sdk --workspace @molr/website
      - run: npm run build --workspace @molr/ui-design
  assets:
    needs: [prepare, source]
    uses: ./.github/workflows/build-assets.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      version: 0.1.0-local
      prefix: ci-
  native:
    needs: [prepare, assets]
    uses: ./.github/workflows/native-build.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      version: 0.1.0-local
      prefix: ci-
      validate: true
      matrix: ${{ needs.prepare.outputs.matrix }}
  browser:
    needs: [prepare, source]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
        project: [desktop, mobile]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: ./.github/actions/setup-build
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
      - if: matrix.project == 'desktop'
        run: npm run test:website
      - name: UI Design browser tests
        run: npm run test:ui -- --project=${{ matrix.project }}
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-${{ matrix.runner }}-${{ matrix.project }}
          path: |
            apps/website/test-results/
            apps/ui-design/test-results/
          if-no-files-found: ignore
          retention-days: 7
  webui:
    needs: [prepare, source]
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: ./.github/actions/setup-build
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
      - uses: ./.github/actions/prepare-sandbox
      - name: WebUI browser tests
        run: npm run test:webui -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4 --fully-parallel --workers=1 --reporter=line,json
        env:
          MOLR_E2E_SANDBOX_SERVICE: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
      - name: Upload WebUI test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webui-report-${{ matrix.project }}-${{ matrix.shard }}
          path: apps/webui/test-results/report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload WebUI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: webui-failure-${{ matrix.project }}-${{ matrix.shard }}
          path: apps/webui/test-results/
          if-no-files-found: ignore
          retention-days: 7
  webui-integration:
    needs: [prepare, assets]
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: ./.github/actions/setup-build
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
      - uses: ./.github/actions/prepare-sandbox
      - name: WebUI MCP integration
        run: npm run test:webui -- mcp-tools.spec.ts --project=${{ matrix.project }}
        env:
          MOLR_E2E_SANDBOX_SERVICE: '1'
          MOLR_E2E_MCP: '1'
      - name: WebUI plugin HTTP integration
        run: npm run test:webui -- plugin-http.spec.ts --project=${{ matrix.project }}
        env:
          MOLR_E2E_SANDBOX_SERVICE: '1'
          MOLR_E2E_PLUGIN_HTTP: '1'
      - uses: actions/download-artifact@v8
        with:
          name: ci-application-assets
          path: .cache/assets-download
      - name: Verify shared application assets for production tests
        run: tar -xzf .cache/assets-download/application-assets.tar.gz && node scripts/build-assets.mjs --verify
      - name: WebUI production lazy loading
        run: npm run test:webui -- lazy-pages.spec.ts --project=${{ matrix.project }}
        env:
          MOLR_E2E_PREVIEW: '1'
          MOLR_E2E_SANDBOX_SERVICE: '1'
      - name: Upload integration failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: webui-integration-failure-${{ matrix.project }}
          path: apps/webui/test-results/
          if-no-files-found: ignore
          retention-days: 7
  installer:
    needs: [prepare, native]
    uses: ./.github/workflows/installer-acceptance.yml
    with:
      artifact-prefix: ci-runtime-
      ref: ${{ needs.prepare.outputs.commit }}
  passed:
    name: CI passed v3
    needs: [prepare, source, assets, native, browser, webui, webui-integration, installer]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validated ${{ needs.prepare.outputs.commit }}
        env:
          RESULTS: ${{ toJSON(needs) }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          node -e 'const n=JSON.parse(process.env.RESULTS); for(const [name,job] of Object.entries(n)) if(job.result!=="success") throw Error(name+": "+job.result); require("node:fs").writeFileSync("ci-validation.json",JSON.stringify({schema:2,commit:process.env.COMMIT,run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,groups:Object.keys(n)},null,2));'
      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: ci-validation
          path: ci-validation.json
          retention-days: 30
