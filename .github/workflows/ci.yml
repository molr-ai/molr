name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.0'
      - uses: actions/setup-go@v6
        with:
          go-version-file: runtime/.go-version
          cache-dependency-path: runtime/go.sum
      - run: npm ci
      - run: npm run check:platforms && npm run check:release && npm run check:licenses
      - run: npm run test:release && npm run test:release-flow
      - run: python3 scripts/test-install-download.py && python3 runtime/scripts/test-install-linux.py && python3 runtime/scripts/test-uninstall-linux.py
      - run: npm run test --workspace @molr/ui
      - run: npm run typecheck && npm run build
        env:
          VITE_SITE_MODE: live
      - run: npx playwright install --with-deps chromium
      - run: npm run test:website
      - run: go test ./...
        working-directory: runtime
        env:
          CGO_ENABLED: '0'
