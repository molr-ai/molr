name: Nightly
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  packages: write
concurrency:
  group: nightly-publication
  cancel-in-progress: false
  queue: max
jobs:
  release:
    uses: ./.github/workflows/release-build.yml
    with:
      kind: nightly
      ref: main
    secrets: inherit
