<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Molr — Cat-ear M, blinking</title>
  <style>
    [data-eye]{animation:molr-blink 4s infinite;transform-box:fill-box;transform-origin:center}
    @keyframes molr-blink{0%,93%{transform:scaleY(1)}95%{transform:scaleY(.1)}98%,100%{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){[data-eye]{animation:none}}
  </style>
  <g transform="translate(1 4)">
  <g stroke="#263b31" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path data-letter="M" d="M8.75 41L10 12L24 22C28.666667 25.333333 33.333333 25.333333 38 22L52 12L53.25 41"/>
  </g>
  <g fill="#263b31">
    <circle data-eye="left" cx="23" cy="36" r="4"/>
    <circle data-eye="right" cx="39" cy="36" r="4"/>
  </g>
  </g>
</svg>
