# Local action mirrors and native runner setup: docs/dev/contributing/gitea-ci.md
name: Gitea CI
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Native platforms: all or comma-separated linux-amd64,linux-arm64,macos-amd64,macos-arm64,windows-amd64. Blank uses repository configuration.'
        type: string
        required: false
        default: ''
      installers:
        description: 'Separate installation acceptance: enabled or disabled. Blank uses repository configuration.'
        type: string
        required: false
        default: ''
  pull_request:
  push:
    branches: [main]
defaults:
  run:
    shell: bash
env:
  CGO_ENABLED: '0'
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
  MOLR_VERSION: 0.1.0-local
jobs:
  source:
    runs-on: molr-linux-amd64
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      matrix: ${{ steps.identity.outputs.matrix }}
      browser_matrix: ${{ steps.identity.outputs.browser_matrix }}
      installer_matrix: ${{ steps.identity.outputs.installer_matrix }}
      browser_enabled: ${{ steps.identity.outputs.browser_enabled }}
      installer_enabled: ${{ steps.identity.outputs.installer_enabled }}
      scope: ${{ steps.identity.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.gitea/actions/setup-build
      - id: identity
        env:
          MOLR_CI_PLATFORMS: ${{ github.event.inputs.platforms || vars.MOLR_CI_PLATFORMS || 'all' }}
          MOLR_CI_INSTALLERS: ${{ github.event.inputs.installers || vars.MOLR_CI_INSTALLERS || 'enabled' }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node scripts/gitea-ci-plan.mjs
      - run: npm run check && npm run test:docs && npm run test:release && npm run test:release-flow
      - run: python3 scripts/test-install-download.py
      - run: npm run test --workspace @molr/ui
      - run: npm run typecheck --workspace @molr/ui --workspace @molr/ui-host --workspace @molr/sdk --workspace @molr/website
      - run: npm run build --workspace @molr/ui-design
  assets:
    needs: source
    runs-on: molr-linux-amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.0'
          package-manager-cache: false
      - run: npm ci
      - run: node scripts/build-assets.mjs
      - name: Archive verified frontend assets
        run: tar -czf application-assets.tar.gz .cache/build-assets/manifest.json apps/webui/dist apps/desktop/dist
      - uses: actions/gitea-upload-artifact@v7
        with:
          overwrite: true
          name: ci-application-assets
          path: application-assets.tar.gz
          if-no-files-found: error
          retention-days: 7
  native:
    needs: [source, assets]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      MOLR_BUILD_ASSETS: '1'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: ./.gitea/actions/setup-build
        with:
          shell: ${{ matrix.shell }}
      - name: Verify native runner platform
        env:
          MOLR_CI_RUNNER: ${{ matrix.runner }}
        run: >-
          node -e "const label = process.env.MOLR_CI_RUNNER;
          const os = label.includes('-linux-') ? 'linux' : label.includes('-macos-') ? 'darwin' : 'win32';
          const arch = label.endsWith('-amd64') ? 'x64' : 'arm64';
          if (process.platform !== os || process.arch !== arch) throw new Error('Runner label does not match native platform: ' + label);
          console.log(process.platform, process.arch, process.version);"
      - uses: actions/gitea-download-artifact@v8
        with:
          name: ci-application-assets
          path: .cache/assets-download
      - name: Restore and verify shared application assets
        run: tar -xzf .cache/assets-download/application-assets.tar.gz && node scripts/build-assets.mjs --verify
      - if: runner.os == 'Linux'
        name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 libnotify4 libsecret-1-0 libatspi2.0-0t64 libuuid1 libdrm2 libxkbcommon0 libcups2t64 xdg-utils
      - if: runner.os == 'Linux'
        uses: ./.github/actions/prepare-sandbox
      - if: runner.os != 'Windows'
        run: npm run build:release
      - if: runner.os == 'Windows'
        run: node apps/desktop/scripts/build-windows-runtime.mjs
      - if: runner.os != 'Windows'
        name: Native Runtime tests
        working-directory: runtime
        env:
          CGO_ENABLED: '0'
        run: go test -p 4 ./... && go vet ./...
      - if: runner.os == 'Windows'
        name: Native Windows backend
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:MOLR_TEST_BINARY = (Resolve-Path '.cache/release/win32-amd64/molr/bin/molr.exe').Path
          go -C runtime test ./internal/platform/sandbox ./internal/textfiles ./internal/installationwindows ./internal/config ./internal/platform ./internal/persistence/sqlitestore -run "TestWindows|TestControlledReady|TestNativeSandbox" -count=1
      - run: node node_modules/electron/install.js
      - name: Desktop unit tests using the shared compiled application
        run: node --test apps/desktop/tests/*.test.mjs
      - if: runner.os != 'Linux'
        run: npm run test:desktop:electron
      - if: runner.os == 'Linux'
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            aa-exec -p chrome -- xvfb-run -a npm run test:desktop:electron
          else
            xvfb-run -a npm run test:desktop:electron
          fi
      - name: Package local evaluation installer
        run: npm run package:desktop
      - if: runner.os != 'Linux'
        name: Evaluate the packaged desktop and bundled Runtime
        run: node scripts/test-desktop-package.mjs
      - if: runner.os == 'Linux'
        name: Evaluate the packaged desktop and bundled Runtime
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            aa-exec -p chrome -- xvfb-run -a node scripts/test-desktop-package.mjs
          else
            xvfb-run -a node scripts/test-desktop-package.mjs
          fi
      - if: runner.os != 'Windows'
        uses: actions/gitea-upload-artifact@v7
        with:
          overwrite: true
          name: ci-runtime-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/gitea-upload-artifact@v7
        with:
          overwrite: true
          name: ci-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/desktop/**/*.deb
            dist/desktop/**/*.dmg
            dist/desktop/**/*.exe
            dist/desktop/**/*.sha256
            dist/desktop/**/desktop-manifest.json
          if-no-files-found: error
          retention-days: 7
  browser:
    needs: source
    if: ${{ needs.source.outputs.browser_enabled == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.browser_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.0'
          package-manager-cache: false
      - name: Verify native runner platform
        env:
          MOLR_CI_RUNNER: ${{ matrix.runner }}
        run: >-
          node -e "const label = process.env.MOLR_CI_RUNNER;
          const os = label.includes('-linux-') ? 'linux' : label.includes('-macos-') ? 'darwin' : 'win32';
          const arch = label.endsWith('-amd64') ? 'x64' : 'arm64';
          if (process.platform !== os || process.arch !== arch) throw new Error('Runner label does not match native platform: ' + label);
          console.log(process.platform, process.arch, process.version);"
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
      - run: npm run test:website
      - name: Upload website failure diagnostics
        if: failure()
        uses: actions/gitea-upload-artifact@v7
        with:
          overwrite: true
          name: website-failure-${{ matrix.runner }}
          path: apps/website/test-results/
          if-no-files-found: ignore
          retention-days: 7
  installer:
    needs: [source, native]
    if: ${{ needs.source.outputs.installer_enabled == 'true' }}
    name: Runtime installation acceptance
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.installer_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.0'
          package-manager-cache: false
      - name: Verify native runner platform
        env:
          MOLR_CI_RUNNER: ${{ matrix.runner }}
        run: >-
          node -e "const label = process.env.MOLR_CI_RUNNER;
          const os = label.includes('-linux-') ? 'linux' : label.includes('-macos-') ? 'darwin' : 'win32';
          const arch = label.endsWith('-amd64') ? 'x64' : 'arm64';
          if (process.platform !== os || process.arch !== arch) throw new Error('Runner label does not match native platform: ' + label);
          console.log(process.platform, process.arch, process.version);"
      - uses: actions/gitea-download-artifact@v8
        with:
          name: ci-runtime-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/releases
      - name: Prepare login session, leaving dependency preparation to Molr
        if: matrix.os == 'linux'
        run: |
          # This job is disposable. Do not use this preparation on a developer host.
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict || true
          fi
          sudo apt-get purge -y bubblewrap busybox-static apparmor-profiles
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Preview, interactive install, silent reinstall, sandbox verification and uninstall
        env:
          MOLR_TEST_PREPARE: '1'
        run: |
          archives=(dist/releases/*.tar.gz)
          test "${#archives[@]}" -eq 1
          for mode in server sandbox; do
            MOLR_TEST_MODE="$mode" MOLR_TEST_ARCHIVE="${archives[0]}" node scripts/test-release-install.mjs
          done
  passed:
    name: Gitea CI passed
    needs: [source, assets, native, browser, installer]
    if: ${{ always() }}
    runs-on: molr-linux-amd64
    steps:
      - name: Require every selected validation group to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
          const results = JSON.parse(process.env.RESULTS);
          for (const name of ["source", "assets", "native"]) {
            if (results[name]?.result !== "success") throw Error(name + ": " + results[name]?.result);
          }
          for (const name of ["browser", "installer"]) {
            const enabled = results.source.outputs[name + "_enabled"];
            if (!["true", "false"].includes(enabled)) throw Error("Missing selection for " + name);
            const expected = enabled === "true" ? "success" : "skipped";
            if (results[name]?.result !== expected) throw Error(name + ": " + results[name]?.result + " (expected " + expected + ")");
          }
          console.log("Validated selected scope: " + results.source.outputs.scope);'
